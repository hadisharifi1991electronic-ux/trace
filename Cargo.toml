[workspace]
resolver = "2"
members = ["crates/trace-core", "crates/trace-altium", "crates/trace-allegro",
    "crates/trace-gerber", "crates/trace-export", "crates/trace-step", "crates/trace-cli", "crates/trace-app"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""

[workspace.dependencies]
trace-core = { path = "crates/trace-core" }
trace-altium = { path = "crates/trace-altium" }
trace-allegro = { path = "crates/trace-allegro" }
trace-gerber = { path = "crates/trace-gerber" }
trace-export = { path = "crates/trace-export" }
trace-step = { path = "crates/trace-step" }

[profile.release]
strip = true
