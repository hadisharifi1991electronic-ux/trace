[package]
name = "trace-core"
description = "Design data model for the Trace PCB design tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
i_overlay = "4"
flate2 = "1"
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
