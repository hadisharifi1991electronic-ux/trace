[package]
name = "trace-gerber"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Reads Gerber, Excellon and ODB++ fabrication data and rebuilds the board"

[dependencies]
trace-core.workspace = true
thiserror = "1"
