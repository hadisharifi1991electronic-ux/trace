[package]
name = "trace-export"
description = "Writes Trace boards in other tools' formats (KiCad, Altium)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
trace-gerber.workspace = true
trace-allegro.workspace = true
trace-altium.workspace = true
serde = "1"
serde_json = "1"
tempfile = "3"

[dependencies]
trace-core.workspace = true
trace-altium.workspace = true
uuid = { version = "1", default-features = false }
cfb = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
